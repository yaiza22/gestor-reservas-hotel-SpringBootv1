spring.application.name=habitaciones
server.port=8081
app.cors.origenes-permitidos=http://localhost:5173,http://localhost:5174
app.datos-iniciales=true
# MongoDB local: bd/server propio de este servicio (Spring Boot 4)
spring.mongodb.uri=mongodb://localhost:27017/hotel_habitaciones?serverSelectionTimeoutMS=3000
# Crea al arrancar los índices declarados con @Indexed
spring.data.mongodb.auto-index-creation=true
# En Spring Data MongoDB 5 no hay representación por defecto de BigDecimal: se pide Decimal128
spring.data.mongodb.representation.big-decimal=decimal128
# Swagger: documenta solo las respuestas declaradas con @ApiResponse en cada endpoint
springdoc.override-with-generic-response=false
