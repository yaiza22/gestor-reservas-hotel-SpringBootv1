spring.application.name=gestor-reservas-hotel
server.port=8080

# MongoDB local: base propia de este servicio (en Spring Boot 4 la propiedad es spring.mongodb.uri)
spring.mongodb.uri=mongodb://localhost:27017/hotel_gestion?serverSelectionTimeoutMS=3000
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.representation.big-decimal=decimal128

# Microservicio de habitaciones
app.habitaciones.url-base=http://localhost:8081
app.habitaciones.timeout-conexion-ms=2000
app.habitaciones.timeout-lectura-ms=5000

# CORS: origen del frontend
app.cors.origenes-permitidos=http://localhost:5173,http://localhost:5174

# Datos de demostración al arrancar
app.datos-iniciales=true

# Evita que DevTools escriba en el log el valor rechazado de la contraseña
spring.mvc.log-resolved-exception=false