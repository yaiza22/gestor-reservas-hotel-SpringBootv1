spring.application.name=gestor-reservas-hotel
server.port=8080

# Microservicio de habitaciones
app.habitaciones.url-base=http://localhost:8081
app.habitaciones.timeout-conexion-ms=2000
app.habitaciones.timeout-lectura-ms=5000

# CORS: origen del frontend
app.cors.origenes-permitidos=http://localhost:5173

# Datos de demostración al arrancar
app.datos-iniciales=true
